name: Deploy Sanity Studio

on:
  push:
    branches:
      - main
    paths:
      - "sanity.config.ts"
      - "sanity.cli.ts"
      - "package.json"
      - "package-lock.json"
      - "schemaTypes/**"
      - "schemas/**"
      - "src/**"
      - "static/**"
      - ".github/workflows/deploy-sanity.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sanity-production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Studio and schema
    runs-on: ubuntu-latest

    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy Sanity Studio
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
        run: npx sanity deploy